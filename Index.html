 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
 </head>
 <body>

   <h1 id="prompt">Rock Paper Scissors!</h1>

   <div id="gameState">
      <h3 id="outcome">Make your choice!</h3>
   </div>
    
   <div id="choices">
      <ul>
         <button id="Rock">Rock</button>
         <button id="Paper">Paper</button>
         <button id="Scissors">Scissors</button>
      </ul>
   </div>

   <div id="scores">
      <div id="humanScoreContainer">
         <h1>Your Score:</h1>
         <h1 id="humanScore">0</h1>
      </div>
      <div id="computerScoreContainer">
         <h1>Computer Score:</h1>
         <h1 id="computerScore">0</h1>
      </div>
   </div>


    <script src="logic.js"></script>

 </body>
 </html>
